<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#070B14"/>
  <!-- Eye contour nodes and links -->
  <path d="M15 50 Q 50 18 85 50 Q 50 82 15 50 Z" stroke="#1F2B47" stroke-width="2.5" stroke-dasharray="2 3"/>
  <path d="M22 50 C 35 30, 65 30, 78 50 C 65 70, 35 70, 22 50 Z" stroke="#FFB020" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Radar concentric circles -->
  <circle cx="50" cy="50" r="24" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 2"/>
  <circle cx="50" cy="50" r="14" stroke="#3DDC97" stroke-width="1.5" fill="#0D1424"/>
  <circle cx="50" cy="50" r="6" fill="#FFB020"/>
  <!-- Nodes around the eye -->
  <circle cx="22" cy="50" r="3.5" fill="#FF5D5D"/>
  <circle cx="78" cy="50" r="3.5" fill="#3DDC97"/>
  <circle cx="50" cy="28" r="3" fill="#22D3EE"/>
  <circle cx="50" cy="72" r="3" fill="#8B7CFF"/>
  <circle cx="36" cy="38" r="2.5" fill="#FFB020"/>
  <circle cx="64" cy="62" r="2.5" fill="#22D3EE"/>
  <!-- Connecting lines -->
  <line x1="22" y1="50" x2="36" y2="38" stroke="#FFB020" stroke-width="1.2" opacity="0.6"/>
  <line x1="36" y1="38" x2="50" y2="50" stroke="#FFB020" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="50" x2="64" y2="62" stroke="#22D3EE" stroke-width="1.2" opacity="0.7"/>
  <line x1="64" y1="62" x2="78" y2="50" stroke="#3DDC97" stroke-width="1.2" opacity="0.6"/>
</svg>